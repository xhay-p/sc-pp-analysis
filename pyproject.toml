[project]
name = "sc-pp-analysis"
version = "0.1.0"
description = "In-silico single-cell perturbation prediction on pseudobulk Perturb-seq"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "anndata",
    "scanpy",
    "matplotlib",
    "seaborn",
    "cell-eval (>=0.8.2)",
    "torch (>=2.14.1,<3.0.0)",
    "streamlit (>=1.66.0,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
ipykernel = "*"
pytest = "*"
ruff = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
